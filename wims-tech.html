  :root{
    --bg:#f3f5f1; --surface:#ffffff; --surface-2:#f5f8f4; --surface-3:#eef2ec;
    --ink:#102925; --ink-2:#28413c; --muted:#6a7d78; --faint:#93a49f;
    --line:#e2e8e1; --line-2:#d6ded5;
    --brand:#0e7a55; --brand-bright:#18a57b; --deep:#082c28;
    --good:#12996f; --good-bg:#e4f5ee; --warn:#c98a10; --warn-bg:#fdf1d8;
    --crit:#d64a2f; --crit-bg:#fde6e0; --info:#3f74d6; --info-bg:#e7eefb;
    --violet:#7a5cc7; --violet-bg:#eee8fa; --lime:#c9f36a;
    --shadow:0 1px 2px rgba(16,41,37,.05),0 10px 28px rgba(16,41,37,.08);
    --radius:14px; --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#081613; --surface:#0f2621; --surface-2:#0c211c; --surface-3:#123029;
    --ink:#e9f2ee; --ink-2:#c2d4ce; --muted:#8ba39c; --faint:#5f746e;
    --line:#1d372f; --line-2:#274539;
    --brand:#2bbd8e; --brand-bright:#33cf9c; --deep:#04140f;
    --good:#2bbd8e; --good-bg:#0e2f27; --warn:#f0b657; --warn-bg:#33280f;
    --crit:#ff7f68; --crit-bg:#3a1c17; --info:#6ea0ff; --info-bg:#122238;
    --violet:#a98bf0; --violet-bg:#221a3a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
  }}
  :root[data-theme="light"]{
    --bg:#f3f5f1; --surface:#ffffff; --surface-2:#f5f8f4; --surface-3:#eef2ec;
    --ink:#102925; --ink-2:#28413c; --muted:#6a7d78; --faint:#93a49f;
    --line:#e2e8e1; --line-2:#d6ded5; --brand:#0e7a55; --brand-bright:#18a57b; --deep:#082c28;
    --good:#12996f; --good-bg:#e4f5ee; --warn:#c98a10; --warn-bg:#fdf1d8;
    --crit:#d64a2f; --crit-bg:#fde6e0; --info:#3f74d6; --info-bg:#e7eefb;
    --violet:#7a5cc7; --violet-bg:#eee8fa;
    --shadow:0 1px 2px rgba(16,41,37,.05),0 10px 28px rgba(16,41,37,.08);
  }
  :root[data-theme="dark"]{
    --bg:#081613; --surface:#0f2621; --surface-2:#0c211c; --surface-3:#123029;
    --ink:#e9f2ee; --ink-2:#c2d4ce; --muted:#8ba39c; --faint:#5f746e;
    --line:#1d372f; --line-2:#274539; --brand:#2bbd8e; --brand-bright:#33cf9c; --deep:#04140f;
    --good:#2bbd8e; --good-bg:#0e2f27; --warn:#f0b657; --warn-bg:#33280f;
    --crit:#ff7f68; --crit-bg:#3a1c17; --info:#6ea0ff; --info-bg:#122238;
    --violet:#a98bf0; --violet-bg:#221a3a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0}
  .wrap{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;
    padding:22px clamp(12px,4vw,40px) 60px;-webkit-font-smoothing:antialiased}
  .wrap *::selection{background:var(--brand-bright);color:#fff}

  .head{max-width:1100px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
  .htitle{display:flex;align-items:center;gap:13px;min-width:0}
  .logo{width:40px;height:40px;border-radius:11px;flex:none;background:var(--lime);
    display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:9px;box-shadow:var(--shadow)}
  .logo span{display:block;width:4px;background:#082c28;border-radius:3px}
  .logo span:nth-child(1){height:9px}.logo span:nth-child(2){height:17px}.logo span:nth-child(3){height:13px}
  .htitle h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px;line-height:1.15}
  .htitle p{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-weight:500}
  .sandbox{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
    color:var(--warn);background:var(--warn-bg);padding:3px 9px;border-radius:20px}
  .reset{font-family:var(--font);font-size:12px;font-weight:700;border:1px solid var(--line-2);
    background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:9px;cursor:pointer}
  .reset:hover{color:var(--crit);border-color:var(--crit)}

  .stage{max-width:1100px;margin:0 auto}

  /* role switch */
  .roles{display:flex;gap:9px;margin-bottom:16px}
  .role{flex:1;display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);
    border-radius:14px;padding:13px 16px;cursor:pointer;transition:.15s;text-align:left;font-family:var(--font)}
  .role:hover{border-color:var(--line-2)}
  .role.on{border-color:var(--brand-bright);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-bright) 18%,transparent)}
  .role .rav{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}
  .role.wh .rav{background:var(--good-bg)}
  .role.tech .rav{background:var(--info-bg)}
  .role b{font-size:14px;font-weight:800;display:block;color:var(--ink)}
  .role span{font-size:11.5px;color:var(--muted);font-weight:500}
  .role .now{margin-left:auto;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
    color:var(--brand);background:var(--good-bg);padding:3px 8px;border-radius:20px;opacity:0;transition:.15s}
  .role.on .now{opacity:1}

  /* live state tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
  @media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px;position:relative;overflow:hidden}
  .tile .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
  .s-good{background:var(--good)}.s-info{background:var(--info)}.s-violet{background:var(--violet)}.s-warn{background:var(--warn)}
  .tile .k{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
  .tile .v{font-size:26px;font-weight:800;margin-top:5px;letter-spacing:-.5px;font-variant-numeric:tabular-nums;transition:.2s}
  .tile .v.bump{color:var(--brand);transform:scale(1.06)}
  .tile .sub{font-size:11px;color:var(--faint);margin-top:1px;font-weight:500}

  .grid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
  @media (max-width:880px){.grid{grid-template-columns:1fr}}

  .li-block{background:var(--crit-bg);color:var(--crit)}.li-recv{background:var(--surface-3);color:var(--muted)}

  .drop .or:before,.drop .or:after{content:"";flex:1;height:1px;background:var(--line-2)}
  .prev{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .prev-h{padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700}
  .prev-h .fn{font-variant-numeric:tabular-nums}
  .prev-stats{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
  .pstat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:20px}

  .ttab span{font-size:11.5px;font-weight:800}

  .scan-btn2{width:100%;font-family:var(--font);font-size:13.5px;font-weight:800;border:1.5px dashed var(--brand-bright);
    background:var(--good-bg);color:var(--brand);border-radius:12px;padding:14px;cursor:pointer;margin-bottom:11px}
  .ropt{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;font-size:13px;font-weight:600;background:var(--surface);cursor:pointer}
  .ropt.sel{border-color:var(--brand-bright);background:var(--good-bg);color:var(--brand);font-weight:800}
  .ropt .rd{width:17px;height:17px;border-radius:50%;border:2px solid var(--line-2);flex:none}

    background:var(--deep);color:#fff;font-size:13px;font-weight:700;padding:12px 20px;border-radius:12px;
    box-shadow:var(--shadow);opacity:0;transition:.3s;display:flex;align-items:center;gap:9px;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  :root[data-theme="dark"] .toast{background:var(--brand-bright);color:#04140f}
</style>

<script>
(function(){
  var WROOT=document.querySelector('.wrap')||document.body;
  var TEAM='Team Alpha', ORG='Test Subcontractor', SUBS='Marilou Delgado';
  var DR='DR-2026-0727-014';
  // deterministic generator — mirrors the demo Converge_CPE_Delivery_DR-2026-0727-014 file
  function sampleRows(){
    var hx=function(n,w){var x=n.toString(16).toUpperCase();while(x.length<w)x='0'+x;return x;};
    var models=[['ZTE F670L','ZTEGD8A4','9C:5D:12',18],['Huawei EG8145V5','4857544C','00:E0:FC',14],['Nokia G-140W-C','ALCLB93F','18:45:93',8]];
    var rows=[],s=0x41C70,m=0x8A4100;
    models.forEach(function(md){for(var i=0;i<md[3];i++){var mm=hx(m,6);rows.push({serial:md[1]+hx(s,4),model:md[0],mac:md[2]+':'+mm.slice(0,2)+':'+mm.slice(2,4)+':'+mm.slice(4,6),remarks:''});s+=7;m+=11;}});
    rows[5].remarks='DOA / no power on test'; rows[27].remarks='DOA / port fault';
    var d1={}; for(var k in rows[2])d1[k]=rows[2][k]; rows.splice(9,0,d1);
    var d2={}; for(var k2 in rows[34])d2[k2]=rows[34][k2]; rows.push(d2);
    return rows;
  }
  var S;
  function fresh(){
    S={
      role:'tech', tab:'install', clock:552 /*9:12*/,
      cpe:[
        {serial:'ZTEGD8A441C70',model:'ZTE F670L',status:'issued',team:TEAM,subs:null},
        {serial:'ZTEGD8A441C77',model:'ZTE F670L',status:'issued',team:TEAM,subs:null},
        {serial:'4857544C41C7E',model:'Huawei EG8145V5',status:'issued',team:TEAM,subs:null},
        {serial:'ALCLB93F41C85',model:'Nokia G-140W-C',status:'issued',team:TEAM,subs:null}
      ],
      received:true, parsed:null, fileName:'',
      pick:[], issCable:5, issConn:20, committed:true,
      teamCable:5, teamConn:20,
      scan:null, /* {serial,ok} */ kitCable:1, kitConn:2, completed:false,
      rep:{oldSerial:null,newScan:null,reason:null,subs:'Marilou Delgado',done:false},
      rec:{serial:null,reason:null,subs:'Jerome Ramos',done:false},
      ledger:[], steps:{received:true,issued:true,ok:false,block:false,done:false}
    };
  }
  function clockStr(){var h=Math.floor(S.clock/60),m=S.clock%60;var ap=h>=12?'AM':'AM';var hh=h;return (hh<10?'0':'')+hh+':'+(m<10?'0':'')+m+' AM';}
  function tick(n){S.clock+=(n||1);}
  var $=function(id){return document.getElementById(id);};

  function toast(msg,ic){var t=$('toast');t.innerHTML=(ic||'✓')+' '+msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2100);}

  function counts(){
    var c={in_stock:0,issued:0,installed:0,defective:0};
    S.cpe.forEach(function(u){c[u.status]=(c[u.status]||0)+1;});
    return c;
  }
  function led(type,ic,cls,title,detail,amt){
    S.ledger.unshift({t:clockStr(),ic:ic,cls:cls,title:title,detail:detail,amt:amt});
  }

  /* ---------- renders ---------- */
  function renderTiles(){
    var c=counts();
    var recovered=S.cpe.filter(function(u){return u.status==='recovered';}).length;
    $('tiles').innerHTML=
      tile('s-info','📶 Issued to me',c.issued,'ready to install')+
      tile('s-good','📈 Installed',c.installed,c.installed?'done today':'none yet')+
      tile('s-good','🧵 FOC spools',S.teamCable,'my balance')+
      tile('s-violet','↩️ Recovered',recovered,recovered?'to return to WH':'none');
    function tile(s,k,v,sub){return '<div class="tile"><div class="stripe '+s+'"></div><div class="k">'+k+'</div><div class="v" data-v>'+v+'</div><div class="sub">'+sub+'</div></div>';}
  }
  function bump(){WROOT.querySelectorAll('.tile .v[data-v]').forEach(function(v){v.classList.add('bump');setTimeout(function(){v.classList.remove('bump')},220);});}

  function renderMain(){
    $('stageMain').innerHTML = S.role==='warehouse' ? whHTML() : techHTML();
    if(S.role==='warehouse') wireReceiving();
  }

  /* ---------- receiving: parse + import ---------- */
  function computeStats(rows){
    var seen={},valid=0,dupes=0,doa=0,units=[];
    rows.forEach(function(r){
      var s=(r.serial||'').trim(); if(!s)return;
      if(seen[s]){dupes++;return;}
      seen[s]=1;valid++;
      var isDoa=/^\s*doa/i.test(r.remarks||'');
      if(isDoa)doa++;
      units.push({serial:s,model:(r.model||'').trim()||'CPE',status:isDoa?'defective':'in_stock'});
    });
    return {total:rows.length,valid:valid,dupes:dupes,doa:doa,units:units};
  }
  function parseCSV(text){
    var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim().length;});
    if(!lines.length)return [];
    var head=lines[0].split(',').map(function(h){return h.trim().toLowerCase();});
    var idx=function(names){for(var i=0;i<head.length;i++)for(var j=0;j<names.length;j++)if(head[i].indexOf(names[j])>=0)return i;return -1;};
    var si=idx(['serial']),mi=idx(['model','description']),ai=idx(['mac']),ri=idx(['remark','status','note']);
    var out=[];
    for(var k=1;k<lines.length;k++){var c=lines[k].split(',');out.push({serial:si>=0?c[si]:'',model:mi>=0?c[mi]:'',mac:ai>=0?c[ai]:'',remarks:ri>=0?(c[ri]||''):''});}
    return out;
  }
  function setParsed(name,rows){var st=computeStats(rows);S.parsed={total:st.total,valid:st.valid,dupes:st.dupes,doa:st.doa,units:st.units};S.fileName=name;}
  function doImport(){
    S.cpe=S.parsed.units.map(function(u){return {serial:u.serial,model:u.model,status:u.status,team:null,subs:null};});
    S.received=true;S.steps.received=true;tick(4);
    led('recv','📥','recv','Received from Converge',S.fileName+' &middot; '+S.parsed.valid+' CPE ('+S.parsed.doa+' DOA → defective)','+'+S.parsed.valid);
  }
  function handleFile(f){
    var name=f.name;
    if(/\.csv$/i.test(name)){
      var rd=new FileReader();
      rd.onload=function(){var rows=parseCSV(String(rd.result));if(!rows.length){toast('No rows found','⚠️');return;}setParsed(name,rows);toast('Parsed '+rows.length+' rows','📄');renderMain();renderGuide();};
      rd.readAsText(f);
    } else { setParsed(name,sampleRows());toast('Loaded sample (xlsx demo)','📄');renderMain();renderGuide(); }
  }
  function wireReceiving(){
    var fi=$('fileInput');
    if(fi)fi.addEventListener('change',function(e){var f=e.target.files[0];if(f)handleFile(f);});
    var dz=$('dropzone');
    if(dz){
      dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('over');});

  function renderGuide(){
    var steps=[
      {k:'ok',t:'Scan an issued modem',d:'Install tab → “Scan issued modem”: the gate accepts your stock (green).'},
      {k:'block',t:'Try a wrong modem',d:'“Scan a wrong modem” → the hard-gate blocks it (red).'},
      {k:'done',t:'Mark the install complete',d:'It installs and your FOC spool balance draws down.'}

    var done=steps.filter(function(s){return S.steps[s.k];}).length;
    $('guideCount').textContent=done+'/'+steps.length;

    $('guide').innerHTML=steps.map(function(s){
      var isDone=S.steps[s.k]; var cls=isDone?'done':(!curFound?'on':''); if(!isDone&&!curFound)curFound=true;
      return '<div class="gstep '+cls+'"><div class="gn">'+(isDone?'✓':'')+'</div><div class="gt"><b>'+s.t+'</b><span>'+s.d+'</span></div></div>';
    }).join('');

  /* ---------- actions ---------- */
  WROOT.addEventListener('click',function(e){
    var roleBtn=e.target.closest('.role'); if(roleBtn&&roleBtn.getAttribute('data-role')){S.role=roleBtn.getAttribute('data-role');renderAll();return;}
    var unpick=e.target.closest('[data-unpick]'); if(unpick){var s=unpick.getAttribute('data-unpick');S.pick=S.pick.filter(function(x){return x!==s;});renderMain();return;}
    var step=e.target.closest('[data-step]'); if(step){var k=step.getAttribute('data-step');var d=+step.getAttribute('data-d');S[k]=Math.max(0,S[k]+d);renderMain();return;}
    var act=e.target.closest('[data-act]'); if(!act)return;
    var a=act.getAttribute('data-act');
    if(a==='choose'){var fi=$('fileInput');if(fi)fi.click();return;}
    if(a==='sample'){setParsed('Converge_CPE_Delivery_'+DR+'.xlsx',sampleRows());toast('Loaded sample file','📄');renderMain();renderGuide();return;}
    if(a==='clearfile'){S.parsed=null;S.fileName='';renderMain();return;}
    if(a==='import'){doImport();toast(S.parsed.valid+' units imported to stock','📥');renderAll();bump();return;}
    if(a==='tab'){S.tab=act.getAttribute('data-tab');renderMain();return;}
    if(a==='scanold'){S.rep.oldSerial='NOKGW140B771';tick();toast('Pulled unit scanned','↩️');renderMain();return;}
    if(a==='scannew_ok'){var m=S.cpe.filter(function(u){return u.status==='issued'&&u.team===TEAM;})[0];if(!m){toast('No issued units left','⚠️');return;}S.rep.newScan={serial:m.serial,ok:true};tick();toast('Valid — issued to you','✓');renderMain();return;}
    if(a==='scannew_bad'){S.rep.newScan={serial:'ZTEGD9911X02',ok:false};tick();led('block','⛔','block','Blocked (replace)','ZTEGD9911X02 not issued to '+TEAM,'gate');toast('Blocked — not your stock','⛔');renderMain();renderLedger();return;}
    if(a==='rep_reason'){S.rep.reason=act.getAttribute('data-reason');renderMain();return;}
    if(a==='saveReplace'){if(!(S.rep.oldSerial&&S.rep.newScan&&S.rep.newScan.ok&&S.rep.reason))return;
      var nu=byS(S.rep.newScan.serial); if(nu){nu.status='installed';nu.subs=S.rep.subs;}
      S.cpe.push({serial:S.rep.oldSerial,model:'(pulled)',status:'recovered',team:TEAM,subs:null});
      S.rep.done=true;tick(2);
      led('install','📈','install','Replaced at '+S.rep.subs,'new '+S.rep.newScan.serial+' installed · old '+S.rep.oldSerial+' recovered','swap');
      toast('Replacement saved','✅');renderAll();bump();return;}
    if(a==='rec_scan'){S.rec.serial='HWEG29X1188';tick();toast('Pulled unit scanned','↩️');renderMain();return;}
    if(a==='rec_reason'){S.rec.reason=act.getAttribute('data-reason');renderMain();return;}
    if(a==='saveRecover'){if(!(S.rec.serial&&S.rec.reason))return;
      S.cpe.push({serial:S.rec.serial,model:'(pulled)',status:'recovered',team:TEAM,subs:null});
      S.rec.done=true;tick(2);
      led('recv','📴','recv','Asset recovery · '+S.rec.subs,S.rec.serial+' recovered ('+S.rec.reason+')','−1');
      toast('Recovery saved','✅');renderAll();bump();return;}
    if(a==='whscan'){
      var next=S.cpe.filter(function(u){return u.status==='in_stock'&&S.pick.indexOf(u.serial)<0;})[0];
      if(!next){toast('No more stock to scan','⚠️');return;}
      S.pick.push(next.serial);tick();toast('Scanned '+next.serial,'📷');renderMain();
    }
    else if(a==='commit'){
      tick(3);
      S.pick.forEach(function(s){var u=byS(s);u.status='issued';u.team=TEAM;});
      S.teamCable=S.issCable;S.teamConn=S.issConn;S.committed=true;S.steps.issued=true;
      led('issue','📤','issue','Issued to '+TEAM,S.pick.length+' CPE + '+S.issCable+' FOC spool',S.pick.length+' units');
      toast(S.pick.length+' modem(s) issued to '+TEAM,'📤');
      renderAll();bump();
    }
    else if(a==='scanok'){
      var mine=S.cpe.filter(function(u){return u.status==='issued'&&u.team===TEAM;})[0];
      if(!mine){toast('No issued units left','⚠️');return;}
      S.scan={serial:mine.serial,ok:true};S.steps.ok=true;tick();toast('Valid &mdash; issued to your team','✓');renderMain();renderGuide();
    }
    else if(a==='scanbad'){
      S.scan={serial:'ZTEGD9911X02',ok:false};S.steps.block=true;tick();
      led('block','⛔','block','Blocked at close-out','ZTEGD9911X02 not issued to '+TEAM,'gate');
      toast('Blocked &mdash; not issued to your team','⛔');renderMain();renderGuide();renderLedger();
    }
    else if(a==='override'){toast('Override request sent to warehouse (logged)','🔓');}
    else if(a==='complete'){
      if(!(S.scan&&S.scan.ok))return;
      var u=byS(S.scan.serial);u.status='installed';u.team=TEAM;u.subs=SUBS;
      S.teamCable=Math.max(0,S.teamCable-S.kitCable);S.teamConn=Math.max(0,S.teamConn-S.kitConn);
      S.completed=true;S.steps.done=true;tick(2);
      led('install','📈','install','Installed at '+SUBS,S.scan.serial+' &middot; kit: '+S.kitCable+' FOC spool, '+S.kitConn+' conn','−'+S.kitCable+' spool');
      toast('Installed &amp; synced','✅');renderAll();bump();
    }
  });

  // type-to-edit quantity fields (update state live; don't re-render so the caret stays put)
  WROOT.addEventListener('input',function(e){
    var t=e.target.closest('[data-num]'); if(!t)return;
    var k=t.getAttribute('data-num');
    var n=parseInt(String(t.value).replace(/[^0-9]/g,''),10); if(isNaN(n))n=0;
    S[k]=n;
  });
  WROOT.addEventListener('blur',function(e){
    var t=e.target.closest('[data-num]'); if(!t)return;
    t.value=S[t.getAttribute('data-num')];   // normalize on leaving the field
  },true);

  $('resetBtn').addEventListener('click',function(){fresh();renderAll();toast('Simulation reset','↺');});

  fresh();
  renderAll();
})();
</script>
